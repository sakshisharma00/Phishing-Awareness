<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Account Verification</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f2f2; display:flex; height:100vh;
         align-items:center; justify-content:center; margin:0; }
  .box { background:#fff; padding:40px; border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.1);
         width:320px; text-align:center; }
  .box h2 { margin-top:0; color:#0078D4; }
  input { width:100%; padding:10px; margin:8px 0; box-sizing:border-box; border:1px solid #ccc;
          border-radius:4px; }
  button { width:100%; padding:10px; background:#0078D4; color:#fff; border:none; border-radius:4px;
           cursor:pointer; margin-top:10px; }
</style>
</head>
<body>
  <div class="box">
    <h2>Account Verification</h2>
    <p style="font-size:13px; color:#666;">Please confirm your credentials to continue.</p>
    <form id="fakeForm">
      <input type="text" placeholder="Username" disabled>
      <input type="password" placeholder="Password" disabled>
      <button type="submit">Sign In</button>
    </form>
  </div>

<script>
// ETHICS: form fields are disabled — no actual credential is ever captured.
// We only log that this user clicked through, with timestamp.
const form = document.getElementById('fakeForm');
form.addEventListener('submit', function(e){
  e.preventDefault();
  logClick();
  window.location.href = "awareness.html";
});

function logClick(){
  const record = {
    event: "clicked_submit",
    timestamp: new Date().toISOString()
  };
  // Replace with your own logging endpoint (Google Form prefilled link / Apps Script / backend).
  // Example placeholder — swap in your actual logging URL:
  console.log("LOG:", record);
  // fetch("YOUR_LOGGING_ENDPOINT", { method:"POST", body: JSON.stringify(record) });
}

// Also log a bare page visit (opened the link at all)
window.addEventListener('load', function(){
  console.log("LOG:", { event:"page_opened", timestamp:new Date().toISOString() });
});
</script>
</body>
</html>
